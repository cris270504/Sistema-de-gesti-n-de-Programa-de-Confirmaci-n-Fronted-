<!DOCTYPE html>
<html lang="es">
<head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sgpc-theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          document.documentElement.setAttribute('data-bs-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logoNav.png?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-title" content="SCJ">
    <!-- Adelanta el handshake DNS + TLS con la API (Render) para que la primera
         petición no pague ~100-300 ms de conexión. -->
    <link rel="preconnect" href="https://sistema-de-gestion-de-programa-de.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://sistema-de-gestion-de-programa-de.onrender.com">
    <meta name="description" content="Sistema de gestión del programa de confirmación parroquial: confirmandos, grupos, catequistas, asistencias y cronograma.">
    <title>Sistema de Confirmación</title>
</head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
