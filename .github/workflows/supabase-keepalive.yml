name: Supabase keep-alive

# El proyecto Supabase (plan Free) se PAUSA tras ~7 días sin actividad — hay que
# reactivarlo a mano desde el dashboard y la primera request falla.
#
# Este job genera actividad 3x/semana (Lun/Mié/Vie 08:00 UTC). Se eligió esa
# cadencia y NO "cada 6 días" porque:
#   - el cron de GitHub puede retrasarse u OMITIR ejecuciones bajo carga;
#   - un intervalo por día-del-mes (p. ej. */6) llega a 7 días en los cambios
#     de mes (25 → 1).
# Con Lun/Mié/Vie el hueco nominal máximo es 3 días y, aun saltándose una
# corrida, ~5 días — cómodo bajo los 7.
#
# Secrets requeridos en el repo (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://srdccebxlslgomvxrfnu.supabase.co   (sin barra final)
#   SUPABASE_ANON_KEY  anon key del proyecto
#
# Si nadie abre la app y este job falla, el proyecto se habrá pausado: la
# ejecución falla y GitHub avisa por mail.

on:
  schedule:
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Supabase (Auth + una consulta real a la BD)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          base="${SUPABASE_URL%/}"   # sin barra final por si el secret la trae
          fail=0

          # 1) GoTrue health — necesita el apikey; 200 si el proyecto está activo.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            "$base/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY")
          echo "auth/v1/health -> $code"
          [ "$code" = "200" ] || fail=1

          # 2) resolver-login: hace un SELECT en public.users → cuenta como
          #    actividad de base de datos y mantiene la Edge Function caliente.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$base/functions/v1/resolver-login" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"login":"keep-alive"}')
          echo "functions/v1/resolver-login -> $code"
          [ "$code" = "200" ] || fail=1

          exit $fail
